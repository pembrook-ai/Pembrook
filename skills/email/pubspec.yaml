# Pembrook Email Skill — Phase 3.
#
# Runs inside a Docker sandbox.
# Sends emails via SMTP and reads IMAP inbox.
# All send_email actions require HITL approval.
#
# Tools exposed:
#   - send_email(to, subject, body, cc?, smtpHost, ...)
#   - list_inbox(imapHost, ...)
#   - read_email(uid, imapHost, ...)
#   - delete_email(uid, imapHost, ...)
#
# Docker image: pembrook-skill-email:latest
# atSign: @skill_email (placeholder)

name: pembrook_skill_email
description: Email skill for Pembrook.
publish_to: none

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  http: ^1.2.1
  logging: ^1.2.0
  mailer: ^6.0.0
  enough_mail: ^2.1.7
