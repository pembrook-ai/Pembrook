  #     - "${BRIDGES_AT_SIGN:-@bridges}"
  #     - "--key-file"
  #     - "/keys/${BRIDGES_KEY_FILE:-bridges.atKeys}"
  #     - "--agent-atsign"
  #     - "${AGENT_AT_SIGN:-@agent}"
  #   volumes:
  #     - "${KEYS_DIR:-~/.atsign/keys}:/keys:ro"
  #   environment:
  #     TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
  #   networks:
