  #   volumes:
  #     - "${KEYS_DIR:-~/.atsign/keys}:/keys:ro"
  #   environment:
  #     AGENT_AT_SIGN: "${AGENT_AT_SIGN:-@agent}"
  #     WHATSAPP_ACCESS_TOKEN: "${WHATSAPP_ACCESS_TOKEN:-}"
  #     WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
  #     WHATSAPP_WEBHOOK_VERIFY_TOKEN: "${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}"
  #     WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET:-}"
  #   ports:
  #     - "127.0.0.1:8080:8080"   # webhook listener — reverse-proxy to expose
  #   networks:
  #     - safeclaw_internal

  # ── Telegram Bridge (optional) ───────────────────────────────────────────────
  # bridge_telegram:
  #   build:
  #     context: .
  #     dockerfile: bridge/telegram/Dockerfile
  #   container_name: safeclaw-bridge-telegram
  #   restart: unless-stopped
  #   command:
  #     - "--atsign"
  #     - "${SERVICES_AT_SIGN:-@services}"
  #     - "--key-file"
  #     - "/keys/${SERVICES_KEY_FILE:-services.atKeys}"
  #   volumes:
  #     - "${KEYS_DIR:-~/.atsign/keys}:/keys:ro"
  #   environment:
  #     AGENT_AT_SIGN: "${AGENT_AT_SIGN:-@agent}"
  #     TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
  #   networks:
  #     - safeclaw_internal

  # ── Discord Bridge (optional) ────────────────────────────────────────────────
  # bridge_discord:
  #   build:
  #     context: .
