## Pembrook — docker-compose.yml
##
## Services:
##   ollama   — bundled LLM (opt-in via --profile bundled-ollama)
##   agent    — Pembrook agent daemon
##   (optional, uncomment when ready)
##   bridge_whatsapp / bridge_telegram / bridge_discord / bridge_slack
##
## QUICK START:
##
##   Option A — use your host's running Ollama (recommended, simplest):
##     1. Start Ollama on your host:  ollama serve
##     2. Pull a model:               ollama pull qwen2.5:7b
##     3. LINUX ONLY: Create docker-compose.override.yml (see GETTING_STARTED.md)
##     4. Start the agent:            docker compose up -d
##
##   Option B — bundled Ollama (runs Ollama inside Docker, CPU):
##     docker compose --profile bundled-ollama up -d
##
##   Option C — bundled Ollama with GPU (Linux + NVIDIA only):
##     docker compose --profile bundled-ollama -f docker-compose.yml -f docker-compose.gpu.yml up -d
##
##   Tail agent logs:   docker compose logs -f agent
##   Stop:              docker compose down
##
## ENVIRONMENT VARIABLES (set in .env — never committed):
##   Required:
##     AGENT_AT_SIGN      — agent atSign,  e.g.  @myagent
##     AGENT_KEY_FILE     — filename only,  e.g.  @myagent_key.atKeys
##     OWNER_AT_SIGN      — owner atSign,  e.g.  @myowner
##     ALLOWED_USERS      — comma-separated list: @myowner,@myservices
##   Optional:
##     OLLAMA_BASE_URL    — default: http://host.docker.internal:11434 (host Ollama)
##                          set to http://ollama:11434 when using --profile bundled-ollama
##     SERVICES_AT_SIGN   — atSign shared by all bridges AND all MCP servers
##     SERVICES_KEY_FILE  — services .atKeys filename
##     OLLAMA_MODEL       — model name (default: qwen2.5:7b)
##
## Keys directory: ~/.atsign/keys/  (default; set KEYS_DIR in .env to override)
##   All .atKeys files must be in this directory on the host.
##   The directory is mounted read-only as /keys inside every container.
##
## SECURITY NOTES:
##   - The agent container accesses Docker socket ONLY to spawn sandboxed
##     skill containers (--network=none --memory=256m --cpus=0.5 --cap-drop=ALL).
##   - SEC-003: A docker-socket-proxy service restricts the agent to only the
##     Docker API operations it needs (create/start/wait/remove/logs/images).
##     The agent connects via tcp://docker_proxy:2375 — NOT the raw host socket.
##   - No inbound ports are opened for the agent (zero open ports).
##   - atSign keys are mounted read-only.
##   - SEC-004: For production, assign a separate atSign per service using the
##     per-service env vars (WHATSAPP_AT_SIGN, MCP_BROWSER_AT_SIGN, etc.).
##     SERVICES_AT_SIGN is a development convenience — see security note below.

name: pembrook

services:
  # ── Ollama — bundled LLM (optional — use --profile bundled-ollama) ──────────
  # By default the agent talks to Ollama running on the HOST at port 11434.
  # Only enable this service if you want Ollama managed by Docker Compose.
  ollama:
    image: ollama/ollama:latest
    container_name: pembrook-ollama
    restart: unless-stopped
    profiles: [bundled-ollama]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # SEC-010: Ollama is only reachable from the agent via the isolated ollama_net.
    # No other containers (bridges, MCP servers, skill sandbox escapes) can reach it.
    networks:
      - ollama_net

  # ── Docker Socket Proxy (SEC-003) ─────────────────────────────────────────
  # Restricts the agent's Docker API access to only the operations it needs:
  # spawning and managing sandboxed skill containers.
  # The proxy intercepts every Docker API call and rejects anything outside
  # the allowed set — even if the agent process is fully compromised.
  #
  # Allowed: containers (create/start/wait/stop/remove/logs/inspect)
  #          images (pull/inspect/list)
  # Denied:  everything else (volumes, networks, swarm, exec, etc.)
  docker_proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:0.2
    container_name: pembrook-docker-proxy
    restart: unless-stopped
    environment:
      # Enable only what the agent's SandboxManager requires.
      CONTAINERS: 1   # create, start, stop, wait, remove, inspect, logs, attach
      IMAGES: 1       # pull, inspect, list
      POST: 1         # allow POST (required for create/start/stop/attach)
      INFO: 1         # required by `docker info` — used by SandboxManager._isDockerAvailable()
      # Everything else defaults to 0 (denied).
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      SWARM: 0
      AUTH: 0
      SECRETS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_proxy_net
    # Never expose the proxy port outside the internal Docker network.

  # ── Pembrook Agent ──────────────────────────────────────────────────────────
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: pembrook-agent:latest
    container_name: pembrook-agent
    restart: unless-stopped
    # No depends_on — agent retries the Ollama connection at request time.
    # Works whether Ollama runs on the host or via --profile bundled-ollama.
    # Linux with host Ollama: create docker-compose.override.yml with network_mode: host
    command:
      - "--atsign"
      - "${AGENT_AT_SIGN:-@agent}"
      - "--key-file"
      - "/keys/${AGENT_KEY_FILE:-agent.atKeys}"
    volumes:
      # atSign keys — read-only.  Default: ~/.atsign/keys (set KEYS_DIR in .env to override).
      - "${KEYS_DIR:-~/.atsign/keys}:/keys:ro"
      # SEC-003: Agent connects to docker_proxy (restricted API) instead of the raw socket.
      # The proxy allows only the container/image operations needed by SandboxManager.
    # No docker.sock mount or group_add needed — proxy handles socket access.
    environment:
      # macOS/Windows: host.docker.internal:11434 (default)
      # Linux with host network: http://localhost:11434
      # Bundled Ollama: http://ollama:11434
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
      OWNER_AT_SIGN: "${OWNER_AT_SIGN:-}"
      ALLOWED_USERS: "${ALLOWED_USERS:-}"
      # SEC-004: In production use per-service atSigns (WHATSAPP_AT_SIGN etc.).
      # SERVICES_AT_SIGN is a dev-only convenience — see .env.example.
      SERVICES_AT_SIGN: "${SERVICES_AT_SIGN:-}"
      TZ: "UTC"
      # SEC-003: Route all Docker CLI calls through the restricted socket proxy.
      # The proxy allows only container/image operations needed by SandboxManager.
      DOCKER_HOST: "tcp://docker_proxy:2375"
      # Optional: pass external LLM API keys from the host .env
      # OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    # host.docker.internal resolves natively on macOS/Windows (Docker Desktop)
    # and via the extra_hosts entry below on Linux (Docker Engine).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The agent opens NO inbound ports — outbound atNetwork + Docker proxy only.
    depends_on:
      - docker_proxy
    networks:
      - pembrook_internal
      - docker_proxy_net
      - ollama_net   # SEC-010: agent-to-Ollama traffic on isolated network

  # ── WhatsApp Bridge (optional) ───────────────────────────────────────────────
  # Uncomment and set SERVICES_AT_SIGN + SERVICES_KEY_FILE in .env to enable.
  # Also set AGENT_AT_SIGN in .env so the bridge knows which atSign to call.
  # bridge_whatsapp:
  #   build:
  #     context: .
  #     dockerfile: bridge/whatsapp/Dockerfile
  #   container_name: pembrook-bridge-whatsapp
  #   restart: unless-stopped
  #   command:
  #     - "--atsign"
  #     - "${SERVICES_AT_SIGN:-@services}"
  #     - "--key-file"
  #     - "/keys/${SERVICES_KEY_FILE:-services.atKeys}"
  #   volumes:
  #     - "${KEYS_DIR:-~/.atsign/keys}:/keys:ro"
  #   environment:
  #     AGENT_AT_SIGN: "${AGENT_AT_SIGN:-@agent}"
  #     WHATSAPP_ACCESS_TOKEN: "${WHATSAPP_ACCESS_TOKEN:-}"
  #     WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
  #     WHATSAPP_WEBHOOK_VERIFY_TOKEN: "${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}"
  #     WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET:-}"
  #   ports:
  #     - "127.0.0.1:8080:8080"   # webhook listener — reverse-proxy to expose
  #   networks:
  #     - pembrook_internal

  # ── Telegram Bridge (optional) ───────────────────────────────────────────────
  # bridge_telegram:
  #   build:
  #     context: .
  #     dockerfile: bridge/telegram/Dockerfile
  #   container_name: pembrook-bridge-telegram
  #   restart: unless-stopped
  #   command:
  #     - "--atsign"
  #     - "${SERVICES_AT_SIGN:-@services}"
  #     - "--key-file"
  #     - "/keys/${SERVICES_KEY_FILE:-services.atKeys}"
  #   volumes:
  #     - "${KEYS_DIR:-~/.atsign/keys}:/keys:ro"
  #   environment:
  #     AGENT_AT_SIGN: "${AGENT_AT_SIGN:-@agent}"
  #     TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
  #   networks:
  #     - pembrook_internal

  # ── Discord Bridge (optional) ────────────────────────────────────────────────
  # bridge_discord:
  #   build:
  #     context: .
  #     dockerfile: bridge/discord/Dockerfile
  #   container_name: pembrook-bridge-discord
  #   restart: unless-stopped
  #   command:
  #     - "--atsign"
  #     - "${SERVICES_AT_SIGN:-@services}"
  #     - "--key-file"
  #     - "/keys/${SERVICES_KEY_FILE:-services.atKeys}"
  #   volumes:
  #     - "${KEYS_DIR:-~/.atsign/keys}:/keys:ro"
  #   environment:
  #     AGENT_AT_SIGN: "${AGENT_AT_SIGN:-@agent}"
  #     DISCORD_TOKEN: "${DISCORD_TOKEN:-}"
  #   networks:
  #     - pembrook_internal

  # ── Slack Bridge (optional) ──────────────────────────────────────────────────
  # bridge_slack:
  #   build:
  #     context: .
  #     dockerfile: bridge/slack/Dockerfile
  #   container_name: pembrook-bridge-slack
  #   restart: unless-stopped
  #   command:
  #     - "--atsign"
  #     - "${SERVICES_AT_SIGN:-@services}"
  #     - "--key-file"
  #     - "/keys/${SERVICES_KEY_FILE:-services.atKeys}"
  #   volumes:
  #     - "${KEYS_DIR:-~/.atsign/keys}:/keys:ro"
  #   environment:
  #     AGENT_AT_SIGN: "${AGENT_AT_SIGN:-@agent}"
  #     SLACK_SIGNING_SECRET: "${SLACK_SIGNING_SECRET:-}"
  #     SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN:-}"
  #   ports:
  #     - "127.0.0.1:8081:8081"   # webhook listener
  #   networks:
  #     - pembrook_internal

  # ── MCP Home Automation Server (optional) ─────────────────────────────────
  # Proxies requests to a local Home Assistant instance.
  # Shares SERVICES_AT_SIGN with bridges (same third atSign, no extra atSign needed).
  # mcp_home:
  #   build:
  #     context: .
  #     dockerfile: mcp_servers/home/Dockerfile
  #   container_name: pembrook-mcp-home
  #   restart: unless-stopped
  #   command:
  #     - "--atsign"
  #     - "${SERVICES_AT_SIGN:-@services}"
  #     - "--key-file"
  #     - "/keys/${SERVICES_KEY_FILE:-services.atKeys}"
  #   volumes:
  #     - "${KEYS_DIR:-~/.atsign/keys}:/keys:ro"
  #   environment:
  #     HA_BASE_URL: "${HA_BASE_URL:-http://homeassistant.local:8123}"
  #     HA_TOKEN: "${HA_TOKEN:-}"
  #   networks:
  #     - pembrook_internal

  # ── MCP Database Server (optional) ────────────────────────────────────────
  # Exposes SQL query tools over a local SQLite database.
  # Shares SERVICES_AT_SIGN with bridges (same third atSign, no extra atSign needed).
  # mcp_database:
  #   build:
  #     context: .
  #     dockerfile: mcp_servers/database/Dockerfile
  #   container_name: pembrook-mcp-database
  #   restart: unless-stopped
  #   command:
  #     - "--atsign"
  #     - "${SERVICES_AT_SIGN:-@services}"
  #     - "--key-file"
  #     - "/keys/${SERVICES_KEY_FILE:-services.atKeys}"
  #   volumes:
  #     - "${KEYS_DIR:-~/.atsign/keys}:/keys:ro"
  #     - "${DB_PATH:-./data}:/data"
  #   environment:
  #     DB_PATH: "${DB_PATH:-/data/pembrook.db}"
  #   networks:
  #     - pembrook_internal

  # ── MCP Browser Server (optional) ─────────────────────────────────────────
  # Provides browser.fetch and browser.extract_text over the atNetwork.
  # Full browser automation (screenshot, click, fill_form) requires an
  # external Playwright sidecar — set PLAYWRIGHT_WS_URL if available.
  # Shares SERVICES_AT_SIGN with bridges (same third atSign, no extra atSign needed).
  mcp_browser:
    build:
      context: .
      dockerfile: mcp_servers/browser/Dockerfile
    container_name: pembrook-mcp-browser
    restart: unless-stopped
    command:
      - "--atsign"
      - "${SERVICES_AT_SIGN:-@services}"
      - "--key-file"
      - "/keys/${SERVICES_KEY_FILE:-services.atKeys}"
    volumes:
      - "${KEYS_DIR:-~/.atsign/keys}:/keys:ro"
    environment:
      PLAYWRIGHT_WS_URL: "${PLAYWRIGHT_WS_URL:-}"
    networks:
      - pembrook_internal

  # ── Log Viewer (monitor dashboard) ─────────────────────────────────────────
  # Real-time web UI for tailing all container logs via SSE.
  # Open http://localhost:9090 in your browser.
  log_viewer:
    build:
      context: ./tools/log_viewer
      dockerfile: Dockerfile
    container_name: pembrook-log-viewer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-compose.yml:/compose/docker-compose.yml:ro
      - ./.env:/compose/.env:ro
    environment:
      PYTHONUNBUFFERED: "1"
      COMPOSE_DIR: "/compose"
    networks:
      - pembrook_internal

volumes:
  ollama_data:
    driver: local

networks:
  pembrook_internal:
    driver: bridge
    internal: false  # agent needs outbound internet for atServer connections
  docker_proxy_net:
    driver: bridge
    internal: true   # SEC-003: proxy network is internal-only (no internet access needed)
  ollama_net:
    driver: bridge
    internal: true   # SEC-010: Ollama reachable only from the agent container
