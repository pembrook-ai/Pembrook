## SafeClaw — docker-compose.yml
##
## Services:
##   ollama   — bundled LLM (opt-in via --profile bundled-ollama)
##   agent    — SafeClaw agent daemon
##   (optional, uncomment when ready)
##   bridge_whatsapp / bridge_telegram / bridge_discord / bridge_slack
##
## QUICK START:
##
##   Option A — use your host's running Ollama (recommended, simplest):
##     1. Start Ollama on your host:  ollama serve
##     2. Pull a model:               ollama pull qwen2.5:7b
##     3. Start the agent:            docker compose up -d
##
##   Option B — bundled Ollama (runs Ollama inside Docker, CPU):
##     docker compose --profile bundled-ollama up -d
##
##   Option C — bundled Ollama with GPU (Linux + NVIDIA only):
##     docker compose --profile bundled-ollama -f docker-compose.yml -f docker-compose.gpu.yml up -d
##
##   Tail agent logs:   docker compose logs -f agent
##   Stop:              docker compose down
##
## ENVIRONMENT VARIABLES (set in .env — never committed):
##   Required:
##     AGENT_AT_SIGN      — agent atSign,  e.g.  @myagent
##     AGENT_KEY_FILE     — filename only,  e.g.  @myagent_key.atKeys
##     OWNER_AT_SIGN      — owner atSign,  e.g.  @myowner
##     ALLOWED_USERS      — comma-separated list: @myowner,@myservices
##   Optional:
##     OLLAMA_BASE_URL    — default: http://host.docker.internal:11434 (host Ollama)
##                          set to http://ollama:11434 when using --profile bundled-ollama
##     SERVICES_AT_SIGN   — atSign shared by all bridges AND all MCP servers
##     SERVICES_KEY_FILE  — services .atKeys filename
##     OLLAMA_MODEL       — model name (default: qwen2.5:7b)
##
## Keys directory: ~/.atsign/keys/  (default; set KEYS_DIR in .env to override)
##   All .atKeys files must be in this directory on the host.
##   The directory is mounted read-only as /keys inside every container.
##
## SECURITY NOTES:
##   - The agent container accesses Docker socket ONLY to spawn sandboxed
##     skill containers (--network=none --memory=256m --cpus=0.5 --cap-drop=ALL).
##   - No inbound ports are opened for the agent (zero open ports).
##   - atSign keys are mounted read-only.

name: safeclaw

services:
  # ── Ollama — bundled LLM (optional — use --profile bundled-ollama) ──────────
  # By default the agent talks to Ollama running on the HOST at port 11434.
  # Only enable this service if you want Ollama managed by Docker Compose.
  ollama:
    image: ollama/ollama:latest
    container_name: safeclaw-ollama
    restart: unless-stopped
    profiles: [bundled-ollama]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── SafeClaw Agent ──────────────────────────────────────────────────────────
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: safeclaw-agent:latest
    container_name: safeclaw-agent
    restart: unless-stopped
    # No depends_on — agent retries the Ollama connection at request time.
    # Works whether Ollama runs on the host or via --profile bundled-ollama.
    command:
      - "--atsign"
      - "${AGENT_AT_SIGN:-@agent}"
      - "--key-file"
      - "/keys/${AGENT_KEY_FILE:-agent.atKeys}"
    volumes:
      # atSign keys — read-only.  Default: ~/.atsign/keys (set KEYS_DIR in .env to override).
      - "${KEYS_DIR:-~/.atsign/keys}:/keys:ro"
      # Docker socket — allows agent to spawn sandboxed skill containers.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Default: host's Ollama via host.docker.internal (macOS/Windows/Linux).
      # Override in .env with OLLAMA_BASE_URL=http://ollama:11434 when using
      # --profile bundled-ollama.
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OWNER_AT_SIGN: "${OWNER_AT_SIGN:-}"
      ALLOWED_USERS: "${ALLOWED_USERS:-}"
      # Timezone for cron scheduling — set TZ in .env to match your local time.
      # e.g. TZ=Europe/London, TZ=America/New_York, TZ=Australia/Sydney
      # Without this, cron expressions like "0 8 * * *" fire at 8am UTC.
      TZ: "${TZ:-UTC}"
      # Optional: pass external LLM API keys from the host .env
      # OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    # host.docker.internal resolves natively on macOS/Windows (Docker Desktop)
    # and via the extra_hosts entry below on Linux (Docker Engine).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - safeclaw_internal
    # The agent opens NO inbound ports — outbound atNetwork + Docker API only.

  # ── WhatsApp Bridge (optional) ───────────────────────────────────────────────
