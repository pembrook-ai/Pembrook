  #   ports:
  #     - "127.0.0.1:8081:8081"   # webhook listener
  #   networks:
  #     - safeclaw_internal

volumes:
  ollama_data:
    driver: local

networks:
  safeclaw_internal:
    driver: bridge
    internal: false  # agent needs outbound internet for atServer connections
