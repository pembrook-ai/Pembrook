  #   environment:
  #     AGENT_AT_SIGN: "${AGENT_AT_SIGN:-@agent}"
  #     DISCORD_TOKEN: "${DISCORD_TOKEN:-}"
  #   networks:
  #     - safeclaw_internal

  # ── Slack Bridge (optional) ──────────────────────────────────────────────────
  # bridge_slack:
  #   build:
  #     context: .
