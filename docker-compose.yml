## SafeClaw — docker-compose.yml
##
## Services:
##   ollama   — local LLM (llama3.2 or any Ollama-compatible model)
##   agent    — SafeClaw agent daemon
##   (optional, uncomment when ready)
##   bridge_whatsapp / bridge_telegram / bridge_discord / bridge_slack
##
## QUICK START:
##   1. Run the setup wizard:      bash scripts/setup.sh
##   2. Pull the Ollama model:     docker compose run --rm ollama ollama pull ${OLLAMA_MODEL:-llama3.2}
##   3. Start all services:        docker compose up -d
##   4. Tail agent logs:           docker compose logs -f agent
##   5. Stop:                      docker compose down
##
## ENVIRONMENT VARIABLES (set in .env — never committed):
##   Required:
##     AGENT_AT_SIGN      — agent atSign,  e.g.  @myagent
##     AGENT_KEY_FILE     — filename only,  e.g.  @myagent_key.atKeys
##     OWNER_AT_SIGN      — owner atSign,  e.g.  @myowner
##     ALLOWED_USERS      — comma-separated list: @myowner,@mybridges
##   Optional:
##     BRIDGES_AT_SIGN    — atSign shared by all bridge processes
##     BRIDGES_KEY_FILE   — bridges .atKeys filename
##     OLLAMA_MODEL       — model name (default: llama3.2)
##
## Keys directory: ~/.atsign/keys/  (default; set KEYS_DIR in .env to override)
##   All .atKeys files must be in this directory on the host.
##   The directory is mounted read-only as /keys inside every container.
##
## SECURITY NOTES:
##   - Ollama is bound to 127.0.0.1 ONLY — only accessible from localhost.
##   - The agent container accesses Docker socket ONLY to spawn sandboxed
##     skill containers (--network=none --memory=256m --cpus=0.5 --cap-drop=ALL).
##   - No inbound ports are opened for the agent (zero open ports).
##   - atSign keys are mounted read-only.

name: safeclaw

services:
  # ── Ollama — local LLM ──────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: safeclaw-ollama
    restart: unless-stopped
    # Bind to loopback only — never expose to external network
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU support — remove the deploy block if you have no NVIDIA GPU:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── SafeClaw Agent ──────────────────────────────────────────────────────────
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: safeclaw-agent:latest
    container_name: safeclaw-agent
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    command:
      - "--atsign"
      - "${AGENT_AT_SIGN:-@agent}"
      - "--key-file"
      - "/keys/${AGENT_KEY_FILE:-agent.atKeys}"
    volumes:
      # atSign keys — read-only.  Default: ~/.atsign/keys (set KEYS_DIR in .env to override).
      - "${KEYS_DIR:-~/.atsign/keys}:/keys:ro"
      # Docker socket — allows agent to spawn sandboxed skill containers.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      OWNER_AT_SIGN: "${OWNER_AT_SIGN:-}"
      ALLOWED_USERS: "${ALLOWED_USERS:-}"
      # Optional: pass external LLM API keys from the host .env
      # OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    networks:
      - safeclaw_internal
    # The agent opens NO inbound ports — outbound atNetwork + Docker API only.

  # ── WhatsApp Bridge (optional) ───────────────────────────────────────────────
