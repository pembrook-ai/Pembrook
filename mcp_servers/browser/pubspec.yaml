/// SafeClaw Browser MCP Server — skeleton for Phase 4.
///
/// Exposes web browsing tools to the agent via the atNetwork (AtRpc).
/// Uses Playwright (via process spawn) for headless browsing.
///
/// Tool list (Phase 4):
///   - browser.fetch(url)             — fetch page HTML
///   - browser.screenshot(url)        — take screenshot (base64 PNG)
///   - browser.extract_text(url)      — extract readable text
///   - browser.click(selector)        — click element (HITL required)
///   - browser.fill_form(fields)      — fill and submit form (HITL required)
///
/// atSign: @mcp_browser (placeholder)
/// Namespace: safeclaw

name: safeclaw_mcp_browser
description: Web browser MCP server for SafeClaw.
publish_to: none

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  at_client: ^3.11.0
  at_cli_commons: ^3.0.1
  at_commons: ^5.7.0
  http: ^1.2.1
  logging: ^1.2.0
  args: ^2.5.0
  html: ^0.15.0
